name: Worker lease fencing checks

on:
  push:
    branches: [feature/durable-worker-leases-fencing-v1]
    paths:
      - 'packages/kratt-runtime/src/worker-lease-coordinator.mjs'
      - 'packages/kratt-runtime/test/worker-lease-coordinator.test.mjs'
      - 'docs/runtime/WORKER-LEASES-FENCING-V1.md'
      - 'docs/runtime/KRATT-PRIME-EVIDENCE-RUNTIME-STAGES-V1.md'
      - '.github/workflows/worker-leases.yml'
  pull_request:
    branches: [feature/policy-bound-worker-proposals-v1]
    paths:
      - 'packages/kratt-runtime/src/worker-lease-coordinator.mjs'
      - 'packages/kratt-runtime/test/worker-lease-coordinator.test.mjs'
      - 'docs/runtime/WORKER-LEASES-FENCING-V1.md'
      - 'docs/runtime/KRATT-PRIME-EVIDENCE-RUNTIME-STAGES-V1.md'
      - '.github/workflows/worker-leases.yml'

permissions:
  contents: read

concurrency:
  group: worker-leases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

