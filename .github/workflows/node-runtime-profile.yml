name: KRATT Node Runtime Profile Tests

on:
  push:
    branches:
      - feature/node-runtime-supervisor-2026-11-08
    paths:
      - "packages/kratt-core/src/node-runtime-profile.mjs"
      - "packages/kratt-core/test/node-runtime-profile.test.mjs"
      - ".github/workflows/node-runtime-profile.yml"
  pull_request:
    branches:
      - feature/hardware-aware-runtime-v0.2.0-2026-11-07
    paths:
      - "packages/kratt-core/src/node-runtime-profile.mjs"
      - "packages/kratt-core/test/node-runtime-profile.test.mjs"
      - ".github/workflows/node-runtime-profile.yml"

permissions:
  contents: read

jobs:
  node-runtime-profile:
    name: Node ${{ matrix.node-version }} profile + Core tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax-check runtime and tests
        run: |
          node --check packages/kratt-core/src/node-runtime-profile.mjs
          node --check packages/kratt-core/test/node-runtime-profile.test.mjs
      - name: Run Node runtime profile tests
        run: node --test packages/kratt-core/test/node-runtime-profile.test.mjs
      - name: Run complete KRATT Core test suite
        run: node --test packages/kratt-core/test/*.test.mjs
