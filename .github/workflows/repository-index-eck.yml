name: KRATT Repository Index ECK

on:
  push:
    branches: [feature/repository-index-eck-durable-v1]
    paths:
      - "packages/kratt-runtime/src/evidence-kernel.mjs"
      - "packages/kratt-runtime/src/repository-evidence-pipeline.mjs"
      - "packages/kratt-runtime/src/repository-index.mjs"
      - "packages/kratt-runtime/src/local-git-source.mjs"
      - "packages/kratt-runtime/src/durable-evidence.mjs"
      - "packages/kratt-runtime/test/local-git-source.test.mjs"
      - "packages/kratt-runtime/test/durable-evidence.test.mjs"
      - ".github/workflows/repository-index-eck.yml"
  pull_request:
    branches: [feature/local-git-eck-index-v1]
    paths:
      - "packages/kratt-runtime/src/evidence-kernel.mjs"
      - "packages/kratt-runtime/src/repository-evidence-pipeline.mjs"
      - "packages/kratt-runtime/src/repository-index.mjs"
      - "packages/kratt-runtime/src/local-git-source.mjs"
      - "packages/kratt-runtime/src/durable-evidence.mjs"
      - "packages/kratt-runtime/test/local-git-source.test.mjs"
      - "packages/kratt-runtime/test/durable-evidence.test.mjs"
      - ".github/workflows/repository-index-eck.yml"

permissions:
  contents: read

jobs:
  repository-index-eck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

