name: KRATT core tests

on:
  push:
    branches:
      - integration/source-reconciliation-2026-10
  pull_request:
    branches:
      - main

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run KRATT core tests
        run: node --test packages/kratt-core/test/*.test.mjs
